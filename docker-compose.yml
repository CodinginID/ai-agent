services:

  # ── Postgres + pgvector: durable control-plane DB + RAG vector store ─────────
  # Opsional via profile `postgres`. Tanpa profil ini bot fallback ke SQLite
  # (data/control_plane.sqlite3) — cukup untuk single-node, tapi RAG pakai
  # in-memory store (hilang saat restart). Aktifkan untuk RAG persisten:
  #   docker compose --profile postgres up -d
  # lalu set DATABASE_URL di .env ke baris postgres (lihat .env.example).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiagent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octopus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octopus}
      POSTGRES_DB: ${POSTGRES_DB:-octopus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octopus} -d ${POSTGRES_DB:-octopus}"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ── Redis: shared state untuk worker tunnel + agent context ──────────────────
  # Privat di network internal backend (tidak ekspos ke host). Worker user
  # talk ke backend via WS; backend yang akses Redis.
  redis:
    image: redis:7-alpine
    container_name: aiagent_redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ollama: AI model server ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aiagent_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      # Pin model di memory supaya tidak load-unload setiap request.
      # 24h = praktisnya selalu hangat selama backend hidup.
      OLLAMA_KEEP_ALIVE: "24h"
      # 1 slot saja — supaya tidak alokasi context dobel (qwen 1.5b @ 32k ctx
      # ~1.5GB per slot; dengan 2 slot llama runner di-SIGKILL OOM).
      OLLAMA_NUM_PARALLEL: "1"
      # Context window yang masuk akal untuk chat ringan + intent — default
      # 32k boros memory dan kita tidak butuh sebesar itu.
      OLLAMA_NUM_CTX: "4096"
    # Catatan: ``deploy.resources`` cuma dipakai di swarm mode. Untuk
    # ``docker compose up`` biasa pakai ``mem_limit`` & ``mem_reservation``.
    mem_limit: 4g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Model init: pull model sekali, lalu selesai ─────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: aiagent_ollama_init
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Bot: Telegram bot utama ──────────────────────────────────────────────────
  # image: dipakai saat `docker compose pull` (user yang install via install.sh)
  # build: dipakai saat `docker compose up --build` (developer lokal)
  bot:
    image: ghcr.io/codinginid/ai-agent:latest
    build:
      context: .
      args:
        # Baked into GET /health. Override with APP_VERSION env when building.
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: aiagent_bot
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      # Untuk full-access agent di Docker, set PROJECT_DIR/AGENT_WORKDIR/TERMINAL_WORKDIR=/workspace di .env.
      # HOST_PROJECT_DIR default "." berarti repo saat ini akan tersedia di /workspace.
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/workspace:rw
    # Port tidak di-expose ke host — hanya Caddy yang bisa akses bot via internal network.
    # Ini yang memungkinkan zero-downtime deploy: Caddy tetap jalan saat bot direstart.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # ── Telegram Adapter: opsional, aktifkan dengan `--profile telegram` ──────────
  # Standalone bot yang forward pesan ke Core /chat/send.
  # User bawa token bot sendiri — Core tidak punya TELEGRAM_BOT_TOKEN.
  #
  # Cara aktifkan:
  #   docker compose --profile telegram up -d telegram-adapter
  #
  # Env yang dibutuhkan di .env:
  #   TELEGRAM_BOT_TOKEN     — token bot Telegram milik user
  #   OCTOPUS_ADMIN_TOKEN    — sama dengan ADMIN_TOKEN di Core
  #   TELEGRAM_BOT_USERNAME  — username bot (tanpa @), untuk deep link pairing
  # Tidak perlu OCTOPUS_USER_EMAIL — user pair sendiri via /start di Telegram.
  telegram-adapter:
    build: ./telegram-adapter
    container_name: aiagent_telegram
    env_file: .env
    environment:
      OCTOPUS_CORE_URL: http://bot:${PORT:-8080}
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - telegram

  # ── Caddy: reverse proxy ──────────────────────────────────────────────────────
  # Satu-satunya service yang expose port ke host.
  # Tetap jalan saat bot direstart → tidak ada port conflict saat deploy ulang.
  #
  # Mode HTTP (default): akses via http://server-ip:PORT
  # Mode HTTPS: isi DOMAIN=your.domain.com di .env, aktifkan blok HTTPS di Caddyfile,
  #             lalu uncomment port 80 & 443 di bawah.
  caddy:
    image: caddy:2-alpine
    container_name: aiagent_caddy
    environment:
      # Caddyfile pakai placeholder ``{$PORT}`` — perlu env var di container
      # supaya placeholder ke-expand. Default 8080 kalau .env tidak set.
      PORT: ${PORT:-8080}
    ports:
      # Host 8090 dipakai karena 8080 sudah dipegang code-server (vps-ali tunnel).
      # cloudflared meneruskan octopus.flowbiz.id → 127.0.0.1:8090 → caddy:8080 → bot:8080.
      - "${CADDY_HOST_PORT:-8090}:${PORT:-8080}"
      # Uncomment dua baris di bawah kalau DOMAIN diset di .env (mode HTTPS):
      # - "80:80"
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
    name: aiagent_postgres_data
  ollama_data:
    name: aiagent_ollama_data
  redis_data:
    name: aiagent_redis_data
  caddy_data:
    name: aiagent_caddy_data
  caddy_config:
    name: aiagent_caddy_config
