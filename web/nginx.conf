# "" bila bukan upgrade (SSE/keep-alive), "upgrade" untuk WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API → backend (bot) : satu origin, jadi tak perlu CORS ────────────────
    # SSE-friendly: buffering off + read-timeout panjang + HTTP/1.1.
    location /chat/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /room/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # /room/ws = WebSocket; request lain (SSE) tetap jalan dengan header ini
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /tasks/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }
    location /auth/ {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
    }
    location /push/ {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass http://bot:8080/health;
    }

    # ── Worker WebSocket (/ws/worker) : pasukan connect via origin publik ──────
    location /ws/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── PWA: SW & version.json jangan di-cache browser (deteksi update cepat) ──
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
