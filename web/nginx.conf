server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API → backend (bot) : satu origin, jadi tak perlu CORS ────────────────
    # SSE-friendly: buffering off + read-timeout panjang + HTTP/1.1.
    location /chat/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /room/ {
        proxy_pass http://bot:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /auth/ {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass http://bot:8080/health;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
